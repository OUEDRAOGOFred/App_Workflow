name: Workflow backend
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r requirements-dev.txt
      - run: make lint test
      - run: cp .env.example .env
      - run: docker compose -f docker-compose.yml -f docker-compose.test.yml config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.test.yml up --build -d --wait --wait-timeout 240
      - run: make smoke
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
