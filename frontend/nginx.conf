# Omit query strings and headers from access logs (OAuth codes and state).
log_format atelier '$remote_addr $request_method $uri $status $body_bytes_sent';
server {
    listen 8080;
    server_name _;
    access_log /dev/stdout atelier;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location = /health-ui { access_log off; default_type text/plain; return 200 'ok'; }
    location = /health { proxy_pass http://api-gateway:8000; }
    location /api/ {
        proxy_pass http://api-gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Request-ID $request_id;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 660s;
    }
    location = /docs {
        proxy_pass http://api-gateway:8000;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; style-src 'self' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com; connect-src 'self'" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /openapi.json { proxy_pass http://api-gateway:8000; }
    location /assets/ { try_files $uri =404; expires 1y; }
    location / { try_files $uri $uri/ /index.html; expires -1; }
}
